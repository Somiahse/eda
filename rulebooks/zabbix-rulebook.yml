- name: Zabbix webhook listener
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001

  rules:
    - name: High CPU detected 
      condition: event.payload.cpu_value | int > 90
      action:
        run_job_template:
          name: Deploy-APP
          organization: Default
